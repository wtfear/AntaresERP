name: antares-erp

services:
  antares-erp:
    build:
      context: ./docker/production
      dockerfile: Dockerfile
      args:
        REPO_URL: https://github.com/wtfear/AntaresERP.git
        APP_REF: main
        ADMIN_NAME: "Antares Admin"
        ADMIN_EMAIL: "admin@wtfear.agency"
        ADMIN_PASSWORD: "antarespassword123"
    image: wtfear/antares-erp:latest
    container_name: antares-erp-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - APP_NAME=AntaresERP
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-antares_erp}
      - DB_USERNAME=${DB_USERNAME:-antares_user}
      - DB_PASSWORD=${DB_PASSWORD:-antares_secure_password}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - antares_storage:/var/www/aureuserp/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - antares-net

  mysql:
    image: mysql/mysql-server:8.0
    container_name: antares-erp-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-antares_root_password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: ${DB_DATABASE:-antares_erp}
      MYSQL_USER: ${DB_USERNAME:-antares_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-antares_secure_password}
      MYSQL_ALLOW_EMPTY_PASSWORD: 0
    volumes:
      - antares_db_data:/var/lib/mysql
    networks:
      - antares-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-antares_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: antares-erp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - antares_redis_data:/data
    networks:
      - antares-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: antares-erp-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - antares-net

networks:
  antares-net:
    driver: bridge

volumes:
  antares_storage:
  antares_db_data:
  antares_redis_data:
