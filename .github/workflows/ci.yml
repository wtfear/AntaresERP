name: AntaresERP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Architecture & Integrity Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath
          tools: composer:v2

      - name: Validate Composer Manifest
        run: |
          echo "Validating composer.json..."
          composer validate --no-check-all --no-check-lock --strict

      - name: Validate Docker Compose Configuration
        run: |
          echo "Testing docker-compose.yml syntax..."
          docker compose config

      - name: Verify Environment Templates & File Structure
        run: |
          echo "Checking essential directories and environment templates..."
          test -f .env.example || { echo "Missing .env.example"; exit 1; }
          test -f docker-compose.yml || { echo "Missing docker-compose.yml"; exit 1; }
          test -d plugins/webkul || { echo "Missing core plugins tree"; exit 1; }
          test -d app || { echo "Missing app directory"; exit 1; }
          test -d resources || { echo "Missing resources directory"; exit 1; }
          test -f artisan || { echo "Missing artisan CLI entrypoint"; exit 1; }

      - name: Verify Brand Assets & Celestial Vectors
        run: |
          echo "Verifying brand assets..."
          test -f public/brand/antares-logo.svg || { echo "Missing antares-logo.svg"; exit 1; }
          test -f public/brand/antares-banner.svg || { echo "Missing antares-banner.svg"; exit 1; }
          grep -q "ANTARES" public/brand/antares-logo.svg || { echo "Invalid logo SVG content"; exit 1; }
          echo "All brand assets and vector signatures verified."
