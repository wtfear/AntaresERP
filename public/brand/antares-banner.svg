<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1A0B2E" />
      <stop offset="100%" stop-color="#0A0A14" />
    </linearGradient>
    <linearGradient id="antaresCoreLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B2B" />
      <stop offset="50%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#8A2387" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8008" />
      <stop offset="100%" stop-color="#FFC837" />
    </linearGradient>
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Constellation Mesh -->
  <g opacity="0.18" stroke="#FF416C" stroke-width="1.5">
    <circle cx="200" cy="180" r="4" fill="#FF8008" />
    <circle cx="340" cy="240" r="6" fill="#FF4B2B" />
    <circle cx="500" cy="160" r="5" fill="#FFC837" />
    <circle cx="950" cy="140" r="4" fill="#FFFFFF" />
    <circle cx="1080" cy="280" r="5" fill="#FF416C" />
    <circle cx="850" cy="460" r="6" fill="#FF8008" />
    <line x1="200" y1="180" x2="340" y2="240" />
    <line x1="340" y1="240" x2="500" y2="160" />
    <line x1="950" y1="140" x2="1080" y2="280" />
    <line x1="1080" y1="280" x2="850" y2="460" />
  </g>

  <!-- Big Hero Star Aura -->
  <g transform="translate(600, 210)">
    <circle cx="0" cy="0" r="110" fill="url(#antaresCoreLg)" opacity="0.3" filter="url(#superGlow)" />
    <!-- 8 Primary Rays -->
    <polygon points="0,-110 24,-34 110,-24 36,22 76,102 0,42 -76,102 -36,22 -110,-24 -24,-34" fill="url(#antaresCoreLg)" />
    <!-- Inner Octagram -->
    <polygon points="0,-76 16,-22 76,0 16,22 0,76 -16,22 -76,0 -16,-22" fill="url(#goldGlow)" opacity="0.95" />
    <!-- Core -->
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="11" fill="#FF4B2B" />
  </g>

  <!-- Typography -->
  <text x="600" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="3" fill="#FFFFFF">
    ANTARES<tspan fill="#FF416C">ERP</tspan>
  </text>
  
  <text x="600" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#FF8008">
    ENTERPRISE AUTONOMOUS ERP &amp; POS ENGINE
  </text>

  <text x="600" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="2" fill="#94A3B8">
    Point-of-Sale • Multi-Warehouse WMS • General Ledger • Supply Chain • HR &amp; Payroll
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 535)">
    <!-- Pill 1 -->
    <g transform="translate(-330, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">100% MIT Licensed</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-110, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#FF416C" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#FF416C">FilamentPHP 5</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(110, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#FF8008" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#FF8008">Retail POS Included</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(330, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Turnkey Docker</text>
    </g>
  </g>
</svg>
