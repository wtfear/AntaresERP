<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="antaresCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B2B" />
      <stop offset="50%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#8A2387" />
    </linearGradient>
    <linearGradient id="emberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8008" />
      <stop offset="100%" stop-color="#FFC837" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="supernova" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="16" />

  <!-- Celestial Grid Background -->
  <g opacity="0.12" stroke="#FF416C" stroke-width="1">
    <line x1="40" y1="20" x2="760" y2="20" />
    <line x1="40" y1="110" x2="760" y2="110" />
    <line x1="40" y1="200" x2="760" y2="200" />
    <circle cx="110" cy="110" r="85" stroke-dasharray="4 6" fill="none" />
  </g>

  <!-- Antares Star Icon -->
  <g transform="translate(110, 110)">
    <!-- Radial aura -->
    <circle cx="0" cy="0" r="56" fill="url(#antaresCore)" opacity="0.25" filter="url(#supernova)" />
    
    <!-- Primary 8-point supergiant rays -->
    <polygon points="0,-68 14,-22 68,-14 22,14 48,64 0,26 -48,64 -22,14 -68,-14 -14,-22" fill="url(#antaresCore)" />
    
    <!-- Inner faceted geometry -->
    <polygon points="0,-48 10,-14 48,0 10,14 0,48 -10,14 -48,0 -10,-14" fill="url(#emberGlow)" opacity="0.9" />
    
    <!-- Core singularity -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="7" fill="#FF4B2B" />
  </g>

  <!-- Typography -->
  <text x="220" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="2" fill="url(#textGrad)">
    ANTARES<tspan fill="#FF416C">ERP</tspan>
  </text>
  
  <text x="222" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#FF8008">
    ENTERPRISE AUTONOMOUS ERP &amp; POS ENGINE
  </text>

  <text x="222" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1.5" fill="#94A3B8">
    RETAIL POS • MULTI-WAREHOUSE WMS • GENERAL LEDGER • PROCUREMENT
  </text>

  <!-- Status indicator badge -->
  <g transform="translate(680, 42)">
    <rect x="-40" y="-14" width="80" height="26" rx="13" fill="#1E293B" stroke="#FF416C" stroke-width="1.5" />
    <circle cx="-24" cy="-1" r="4" fill="#10B981" />
    <text x="-12" y="3" font-family="sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" letter-spacing="1">MIT</text>
  </g>
</svg>
